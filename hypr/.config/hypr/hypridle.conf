general {
    lock_cmd = pgrep -x hyprlock >/dev/null || hyprlock --config ~/.config/hypr/hyprlock.conf --grace 0 --immediate-render
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = pgrep -x hyprlock >/dev/null || hyprlock --config ~/.config/hypr/hyprlock.conf --grace 0 --immediate-render
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

