$font = "Adwaita Sans"
$lockMonitor = eDP-1
$text = rgba(f6f5f4ff)
$textDim = rgba(f6f5f4bf)
$textMuted = rgba(f6f5f47a)
$glass = rgba(11131899)
$glassStrong = rgba(111318c9)
$glassBorder = rgba(f6f5f43d)
$accent = rgba(3584e4ff)


general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = adw, 0.16, 1.0, 0.3, 1.0
    animation = fadeIn, 1, 2.4, adw
    animation = fadeOut, 1, 1.8, adw
    animation = inputFieldWidth, 1, 2.2, adw
    animation = inputFieldColors, 1, 2.2, adw
    animation = inputFieldDots, 1, 1.8, adw
    animation = inputFieldFade, 1, 1.8, adw
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    noise = 0.003
    contrast = 0.86
    brightness = 0.58
    vibrancy = 0.04
    vibrancy_darkness = 0.18
}

label {
    monitor = $lockMonitor
    text = $TIME
    color = $text
    font_size = 132
    font_family = $font
    text_align = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000a0)
    position = 0, 218
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor = $lockMonitor
    text = cmd[update:60000] date +"%A, %d %B"
    color = $textDim
    font_size = 26
    font_family = $font
    text_align = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000080)
    position = 0, 82
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor = $lockMonitor
    size = 480, 72
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.38
    dots_center = true
    outer_color = $glassBorder
    inner_color = $glassStrong
    font_color = $text
    fail_text = <i>$FAIL</i>
    check_text = Unlocking…
    placeholder_text = Password
    fade_on_empty = false
    rounding = 36
    check_color = $accent
    fail_color = rgba(ff7b63ff)
    capslock_color = rgba(f8e45cff)
    numlock_color = rgba(f8e45cff)
    bothlock_color = rgba(f8e45cff)
    font_family = $font
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(00000070)
    position = 0, -78
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor = $lockMonitor
    text = $LAYOUT
    color = $textMuted
    font_size = 14
    font_family = $font
    text_align = center
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(00000070)
    position = 0, -154
    halign = center
    valign = center
    zindex = 2
}
