#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = sh -c 'command -v xrdb >/dev/null 2>&1 && xrdb -merge "$HOME/.Xresources"'
exec-once = sh -c 'exec "$HOME/.config/hypr/scripts/apply-appearance.sh"'

exec-once = hyprpaper
exec-once = sh -c 'exec "$HOME/.config/hypr/scripts/brightness-restore.sh"'
exec-once = sh -c 'sleep 2; exec "$HOME/.config/hypr/scripts/brightness-restore.sh"'
exec-once = hypridle -q
exec-once = /usr/local/libexec/hyprpolkitagent

exec-once = pipewire
exec-once = wireplumber

exec-once = sh -c 'pgrep -x wl-paste >/dev/null || daemon -p "${XDG_RUNTIME_DIR:-/tmp}/cliphist-watcher.pid" -o "${XDG_RUNTIME_DIR:-/tmp}/cliphist-watcher.log" /usr/local/bin/wl-paste --watch "$HOME/.config/hypr/scripts/clipboard-watch.sh"'

exec-once = qs -n -d
