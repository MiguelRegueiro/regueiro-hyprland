#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_workspaces = 24
    gaps_in = 2
    gaps_out = 24
    border_size = 2
    col.active_border = rgba(818a9cff)
    col.inactive_border = rgba(393c44dd)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.03
        contrast = 1.05
        brightness = 0.9
        vibrancy = 0.18
        vibrancy_darkness = 0.25
    }
}

animations {
    enabled = true

    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = standard, 0.2, 0, 0, 1

    animation = windowsIn, 1, 1, emphasizedDecel
    animation = windowsOut, 1, 1, emphasizedAccel
    animation = windowsMove, 1, 0.5, standard
    animation = border, 1, 1.5, standard
    animation = fade, 1, 1, standard
    animation = workspaces, 1, 1.3, standard, slide
    animation = layers, 1, 1.3, emphasizedDecel
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    key_press_enables_dpms = false
    mouse_move_enables_dpms = true
    vrr = 0
}

render {
    direct_scanout = false
}

opengl {
    nvidia_anti_flicker = true
}

cursor {
    no_hardware_cursors = true
}
