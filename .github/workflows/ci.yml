name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    name: Installer and session regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep stow
      - name: Run installer and session regression suite
        run: tests/test-installer.sh
      - name: Run standalone session cleanup regression
        run: tests/test-session-cleanup.sh
