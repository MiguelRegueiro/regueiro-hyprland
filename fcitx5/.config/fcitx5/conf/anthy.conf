# Anthy input-mode shortcuts.
#
# On Spanish layouts, Ctrl+, may be delivered as either comma or less. Bind
# both forms directly to Latin input. Keep the full five-mode cycle far away
# on Ctrl+F12, so it cannot collide with the punctuation key.
[Key/LatinModeKey]
0=Control+comma
1=Control+less

[Key/CircleInputModeKey]
0=Control+F12

[Key/CircleKanaModeKey]
0=Control+period
