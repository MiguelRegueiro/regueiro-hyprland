"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000
palette = "miguel_deep_red"

format = """[](surface0)\
$os$username\
[](fg:surface0 bg:overlay0)\
$directory\
[](fg:overlay0 bg:red)\
$git_branch$git_status\
[](fg:red bg:dark_red)\
$python$nodejs$rust$golang$docker_context\
[](fg:dark_red bg:accent)\
$time\
[](fg:accent)\
$line_break$character"""

# ---------- Modules ----------

[os]
disabled = false
style = "bg:surface0 fg:text"
format = "[ $symbol ]($style)"

[os.symbols]
FreeBSD = ""
Linux = ""
Arch = ""

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:danger fg:text bold"
format = "[ $user ]($style)"

[directory]
style = "fg:text bg:overlay0"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾"

[git_branch]
symbol = ""
style = "bg:red fg:text bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:red fg:text bold"
format = "[ $all_status$ahead_behind ]($style)"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = '\$'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
symbol = ""
style = "bg:dark_red fg:text"
format = "[ $symbol $version ]($style)"

[nodejs]
symbol = ""
style = "bg:dark_red fg:text"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:dark_red fg:text"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:dark_red fg:text"
format = "[ $symbol $version ]($style)"

[docker_context]
symbol = ""

style = "bg:dark_red fg:text"
format = "[ $symbol $context ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:accent fg:text"
format = "[ $time ]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[➜](bold fg:#b11226)"
error_symbol = "[✘](bold fg:#e01b2f)"
vimcmd_symbol = "[❮](bold fg:#b11226)"

# No annoying repeated duration on empty Enter
[cmd_duration]
disabled = true

# No ugly [127]
[status]
disabled = true

[package]
disabled = true

[hostname]
disabled = true

# ---------- Palette: dark blood red, not pink ----------
[palettes.miguel_deep_red]
surface0 = "#2b252b"
overlay0 = "#373039"
red      = "#a4161a"
dark_red = "#6f1118"
accent   = "#28222a"
danger   = "#c1121f"
text     = "#e3d7dc"
base     = "#e3d7dc"
