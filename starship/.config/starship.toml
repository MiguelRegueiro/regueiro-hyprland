"$schema" = 'https://starship.rs/config-schema.json'

format = """
$cmd_duration\
[](fg:overlay0)\
$directory\
[](fg:overlay0 bg:git)\
$git_branch$git_status\
[](fg:git bg:runtime)\
$python$nodejs$rust$golang$docker_context\
[](fg:runtime bg:time_bg)\
$time\
[](fg:time_bg)\
$line_break$status$character"""

palette = "prompt"

[cmd_duration]
min_time = 1000
format = "[$duration]($style)\n"
style = "fg:lavender"

[directory]
style = "fg:foreground bg:overlay0"
format = "[ $path ]($style)"
truncation_length = 2
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bg:git fg:foreground"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:git fg:foreground"
format = '([$all_status$ahead_behind]($style))'
modified = "*"
staged = "+"
untracked = "?"
stashed = ""
ahead = "↑"
behind = "↓"
diverged = "↕"
conflicted = "!"

[python]
symbol = ""
style = "bg:runtime fg:foreground"
format = '[ $symbol $version ]($style)'

[nodejs]
symbol = ""
style = "bg:runtime fg:foreground"
format = '[ $symbol $version ]($style)'

[rust]
symbol = ""
style = "bg:runtime fg:foreground"
format = '[ $symbol $version ]($style)'

[golang]
symbol = ""
style = "bg:runtime fg:foreground"
format = '[ $symbol $version ]($style)'

[docker_context]
symbol = ""
style = "bg:runtime fg:foreground"
format = '[ $symbol $context ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "bg:time_bg fg:foreground"
format = '[ $time ]($style)'

# Prompt character
[character]
success_symbol = '[➜](bold fg:#5246f2)'
error_symbol = '[➜](bold fg:#5246f2)'

[status]
disabled = false
map_symbol = true
symbol = "✘"
sigint_symbol = ""
style = "bold fg:#ff0000"
format = '([$symbol]($style) )'

# ---------- Prompt Palette ----------
[palettes.prompt]
overlay0 = "#2f2f3c"       # Slightly lighter grey
git = "#2D5BE3"             # Git branch and status
runtime = "#1a48cf"         # Language and tool versions
time_bg = "#22222e"         # Time segment and end cap
lavender = "#9a9fe1"        # Command duration
foreground = "#d4d6e0"      # Prompt text
